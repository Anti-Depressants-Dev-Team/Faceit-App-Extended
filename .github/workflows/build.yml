name: Build

# Sanity check on every push and PR: dependencies resolve, the sources parse,
# and the app actually packages. No publishing happens here.
on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'extensions/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'electron/**'
      - 'extensions/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check sources parse
        shell: bash
        run: |
          set -e
          for file in src/*.js src/renderer/*.js; do
            node --check "$file"
            echo "ok  $file"
          done

      - name: Package (no installer, no publish)
        run: npx electron-builder --dir --publish never

      - name: Verify extensions were bundled
        shell: bash
        run: |
          set -e
          ls dist/win-unpacked/resources/extensions
          test -f "dist/win-unpacked/FACEIT Extended.exe"
          # Extensions keep code in their own src/ folders - make sure the
          # packaging filter that drops *-src checkouts doesn't eat those too.
          test -f dist/win-unpacked/resources/extensions/faceit-forecast/src/visual/popup.html
          test -f dist/win-unpacked/resources/extensions/faceit-extender/src/pages/popup/index.html
          test ! -e dist/win-unpacked/resources/extensions/faceit-mappio-src
