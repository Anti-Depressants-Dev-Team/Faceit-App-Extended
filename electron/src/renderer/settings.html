<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Extensions - FACEIT Extended</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body class="window-focused">
    <header class="titlebar">
      <svg class="titlebar-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 4.5h3.5a1.5 1.5 0 0 1 3 0H19v4a1.5 1.5 0 0 1 0 3v4h-3.5a1.5 1.5 0 0 0-3 0H9v-3.5a1.5 1.5 0 0 1 0-3V4.5Z" />
      </svg>
      <span class="titlebar-text">Extensions</span>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1>Extensions</h1>
          <p class="count" id="count"></p>
        </div>

        <ul class="ext-list" id="list" role="listbox" aria-label="Extensions"></ul>

        <footer class="sidebar-foot">
          <p>FACEIT reloads on its own when you switch an extension on or off.</p>
          <button class="ghost small" id="reload-site" type="button">Reload FACEIT now</button>
        </footer>
      </aside>

      <section class="detail" id="detail" hidden>
        <div class="detail-head">
          <img class="detail-icon" id="d-icon" alt="" />
          <div class="detail-title">
            <h2 id="d-name"></h2>
            <p class="meta" id="d-meta"></p>
          </div>
          <button class="switch big" id="d-switch" type="button" role="switch" aria-checked="false">
            <span class="switch-label" id="d-switch-label">Off</span>
            <span class="track"><span class="thumb"></span></span>
          </button>
        </div>

        <p class="desc" id="d-desc"></p>
        <p class="callout warn" id="d-note" hidden></p>
        <p class="callout error" id="d-error" hidden></p>

        <div class="toolbar">
          <div class="tabs" id="tabs" role="tablist">
            <button type="button" role="tab" data-page="popup">Quick settings</button>
            <button type="button" role="tab" data-page="options">All options</button>
          </div>
          <span class="spacer"></span>
          <button class="ghost" id="reload-page" type="button" title="Reload this settings page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" />
              <path d="M19.5 4.5v4.2h-4.2" />
            </svg>
            Reload
          </button>
          <button class="ghost danger" id="reset" type="button" title="Clear everything this extension has saved">
            Reset data
          </button>
        </div>

        <div class="stage" id="stage">
          <div class="placeholder" id="placeholder">
            <p class="placeholder-title" id="ph-title"></p>
            <p class="placeholder-body" id="ph-body"></p>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="settings.js"></script>
  </body>
</html>
